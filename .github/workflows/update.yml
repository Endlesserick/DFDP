name: Auto Fetch DFCNDP

on:
  schedule:
    # 香港時間 (UTC+8) 每天 00:05, 00:30, 08:30, 12:30 自動執行 (UTC時間減8小時)
    - cron: '5,30 16 * * *'
    - cron: '30 0,4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run fetcher script
        run: python fetch_pw.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add password.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily password" && git push)
